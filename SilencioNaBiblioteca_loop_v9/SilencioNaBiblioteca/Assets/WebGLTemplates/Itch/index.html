<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
  <title>Silêncio na Biblioteca</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%230d0907'/%3E%3Cpath d='M14 18c6-3 12-3 18 1v30c-6-4-12-4-18-1V18z' fill='%23e8c477'/%3E%3Cpath d='M50 18c-6-3-12-3-18 1v30c6-4 12-4 18-1V18z' fill='%23c58a3a'/%3E%3C/svg%3E">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d0907;
      color: #f0d9a8;
      font-family: Georgia, "Times New Roman", serif;
    }
    #unity-container {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 45%, #1d130d 0%, #0d0907 70%);
    }
    #unity-canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #0d0907;
      outline: none;
      cursor: default;
    }
    #unity-loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #0d0907;
      z-index: 5;
      transition: opacity .6s ease;
    }
    #unity-loading.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #unity-loading h1 {
      margin: 0;
      font-size: clamp(22px, 4vw, 44px);
      font-weight: normal;
      letter-spacing: .14em;
      color: #e8c477;
      text-shadow: 0 2px 18px rgba(232, 196, 119, .25);
      text-align: center;
      text-transform: uppercase;
    }
    #unity-loading .sub {
      margin: 0;
      font-size: clamp(12px, 1.4vw, 15px);
      letter-spacing: .22em;
      text-transform: uppercase;
      color: #9c7d58;
    }
    #unity-progress-track {
      width: min(420px, 70vw);
      height: 8px;
      border: 1px solid #6b4a2a;
      background: #1a120c;
      border-radius: 2px;
      overflow: hidden;
    }
    #unity-progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #8a5a2b, #e8c477);
      transition: width .18s linear;
    }
    #unity-progress-text {
      font-size: 12px;
      letter-spacing: .1em;
      color: #8f7150;
    }
    #unity-fullscreen {
      position: absolute;
      right: 12px;
      bottom: 12px;
      width: 38px;
      height: 38px;
      border: 1px solid rgba(232, 196, 119, .35);
      border-radius: 4px;
      background: rgba(13, 9, 7, .55);
      color: #e8c477;
      font-size: 18px;
      line-height: 36px;
      text-align: center;
      cursor: pointer;
      z-index: 6;
      opacity: .55;
      user-select: none;
      transition: opacity .2s ease, background .2s ease;
    }
    #unity-fullscreen:hover {
      opacity: 1;
      background: rgba(40, 26, 15, .85);
    }
    #unity-warning {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 7;
      display: none;
    }
    #unity-warning div {
      color: #1a120c;
      font-family: system-ui, sans-serif;
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" width="{{{ WIDTH }}}" height="{{{ HEIGHT }}}" tabindex="-1"></canvas>

    <div id="unity-loading">
      <h1>Silêncio na Biblioteca</h1>
      <p class="sub">13 de outubro de 1999</p>
      <div id="unity-progress-track"><div id="unity-progress-fill"></div></div>
      <div id="unity-progress-text">carregando…</div>
    </div>

    <div id="unity-fullscreen" title="Tela cheia">&#x26F6;</div>
    <div id="unity-warning"></div>
  </div>

  <script>
    var canvas = document.querySelector("#unity-canvas");
    var loading = document.querySelector("#unity-loading");
    var progressFill = document.querySelector("#unity-progress-fill");
    var progressText = document.querySelector("#unity-progress-text");

    function unityShowBanner(msg, type) {
      var banner = document.querySelector("#unity-warning");
      var div = document.createElement("div");
      div.innerHTML = msg;
      div.style.padding = "10px";
      if (type == "error") div.style.background = "#c0392b";
      else if (type == "warning") div.style.background = "#d6a33a";
      else div.style.background = "#e8c477";
      banner.appendChild(div);
      banner.style.display = "block";
      if (type != "error") {
        setTimeout(function () {
          if (div.parentNode) div.parentNode.removeChild(div);
          banner.style.display = banner.children.length ? "block" : "none";
        }, 6000);
      }
    }

    var config = {
      arguments: [],
#if PROGRESSIVE_ASSET_LOADING
      primaryDataUrls: {{{ JSON.stringify(PRIMARY_DATA_FILES) }}},
      secondaryDataUrls: {{{ JSON.stringify(SECONDARY_DATA_FILES) }}},
#else
      dataUrl: "Build/{{{ DATA_FILENAME }}}",
#endif
      frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
      codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      showBanner: unityShowBanner
    };

    var script = document.createElement("script");
    script.src = "Build/{{{ LOADER_FILENAME }}}";
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        if (progress < 1) {
          progressFill.style.width = Math.round(progress * 100) + "%";
          progressText.textContent = "carregando… " + Math.round(progress * 100) + "%";
        } else {
          progressFill.style.width = "100%";
          progressText.textContent = "pronto";
          loading.classList.add("hidden");
          setTimeout(function () { loading.style.display = "none"; }, 650);
        }
      }).then(function (unityInstance) {
        document.querySelector("#unity-fullscreen").onclick = function () {
          unityInstance.SetFullscreen(1);
        };
      }).catch(function (message) {
        progressText.textContent = "falha ao carregar";
        unityShowBanner("Não foi possível iniciar o jogo: " + message, "error");
      });
    };
    script.onerror = function () {
      progressText.textContent = "falha ao carregar";
      unityShowBanner("Não foi possível carregar o jogo. Verifique sua conexão e recarregue a página.", "error");
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
